[project]
name = "specialk"
version = "0.1.0"
description = "text based style transfer with sequence models"
authors = [{ name = "@thien", email = "thien@users.noreply.github.com" }]
dependencies = [
    "absl-py==2.4.0",
    "datasets==5.1.0",
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
    "einops==0.8.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "evaluate==0.4.2",
    "fasttext @ git+https://github.com/facebookresearch/fastText.git@1142dc4c4ecbc19cc16eee5cdd28472e689267e6",
    "filelock==4.2.4",
    "ftfy==6.2.3",
    "gensim==4.4.0",
    "huggingface-hub==2.3.0",
    "jaxtyping==0.2.31",
    "joblib==1.4.2",
    "lightning==2.6.6",
    "matplotlib==3.9.2",
    "nltk==3.10.4",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "peft==0.21.2",
    "pot==0.9.7.post1",
    "pytelegrambotapi==4.20.0",
    "pyyaml==6.0.2",
    "rich==13.7.1",
    "rouge-score==0.1.2",
    "sacrebleu==2.4.2",
    "sacremoses==0.1.1",
    "safetensors==0.8.0",
    "schedulefree==1.2.7",
    "scikit-learn==1.6.1",
    "scipy==1.15.3",
    "sentencepiece==0.2.2",
    "spacy==3.8.16",
    "structlog==24.2.0",
    "tensorboardx==2.6.2.2",
    "termcolor==3.3.0",
    "toolz==0.12.1",
    "torch==2.14.1",
    "torchmetrics==1.4.0.post0",
    "tqdm==4.66.4",
    "transformers==5.20.2",
]
readme = "readme.md"
requires-python = ">=3.11,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-watch==4.2.0",
    "pytest-xdist==3.8.0",
    "pyfakefs==5.6.0",
]

[tool.uv]
managed = true
constraint-dependencies = ["pyarrow==26.0.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["specialk"]

[tool.ruff.lint]
ignore=["F722"]

[tool.pytest.ini_options]
testpaths = "./tests"
pythonpath = "."
addopts = "-ra -q"
filterwarnings = ["ignore:.*U.*mode is deprecated:DeprecationWarning", "ignore::DeprecationWarning"]
markers = ["lightweight: marks tests as lightweight (deselect with '-m \"not lightweight\"')","heavyweight: marks tests that require large model downloads"]

[tool.coverage.run]
source = ["specialk"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:"]

