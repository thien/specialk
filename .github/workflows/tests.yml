name: Run Lightweight Tests

on: [push, pull_request]

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 'latest'
    - name: Install Project
      run: uv sync
    - name: Download misc. Dependencies
      run: uv run python -m nltk.downloader cmudict averaged_perceptron_tagger
    - name: Run Lightweight Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        uv run pytest -v -m "not heavyweight"
