name: Run Lightweight Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 'latest'
    - name: Install Project
      run: uv sync --locked
    - name: Download misc. Dependencies
      run: make download-deps
    - name: Run Lightweight Tests
      run: uv run pytest -v -m "not heavyweight"
